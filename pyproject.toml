    "scikit-learn>=1.2.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "streamlit>=1.30.0",
    "streamlit-option-menu>=0.3.12",
    "kagglehub>=0.2.7",
    "tqdm>=4.65.0",
    "jupyter>=1.0.0",
    "umap-learn>=0.5.3",
    "grad-cam>=1.4.8",
    "lion-pytorch>=0.0.6"
